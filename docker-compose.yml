services:
  db:
    image: postgres:16-alpine
    container_name: futbol_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: futbol
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
    ports:
      - "${DBPORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d futbol"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: futbol_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_NAME: futbol
      DATABASE_USER: postgres
      DATABASE_PASSWORD: admin
      DATABASE_HOST: db
      DBPORT: 5432
      DATABASE_DIALECT: postgres
      SESSION_SECRET: beb36f16-96df-437f-bc65-e76c0c638c8b
    ports:
      - "3000:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:3000/health', (res) => process.exit(res.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  postgres_data:
